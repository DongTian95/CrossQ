# @package _global_
defaults:
  - override /hydra/launcher: clusterduck_slurm
  - override /hydra/sweeper: list

hydra:
  mode: MULTIRUN
  launcher:
    timeout_min: 9
    name: benchmark
    partition: cpuonly
    nodes: 1
    tasks_per_node: 1
    cpus_per_task: 152
    account: "hk-project-p0022232"
    array_parallelism: 120
    setup:
      # Set environment variables for CPU-only training
      - export JAX_PLATFORM_NAME=cpu
      # set thread number
      - export OMP_NUM_THREADS=30
      - export MKL_NUM_THREADS=30
      - export XLA_FLAGS=--xla_cpu_multi_thread_eigen=true,intra_op_parallelism_threads=30
      - export OMP_PROC_BIND=spread
      - export OMP_PLACES=cores

      - export WANDB_DIR=$TMPDIR/wandb
      - mkdir -pv $WANDB_DIR
      - export WANDB_CONSOLE=off

    parallel_runs_per_node: 5
    total_runs_per_node: 5
#    resources_config:
#      cpu:
#      rendering:
#      stagger:
#        delay: 5

  sweeper:
    grid_params:
      crossq.env: [Ant-v4]
      crossq.seed: [0, 1, 2, 3, 4]