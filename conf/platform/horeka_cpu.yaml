# @package _global_
defaults:
  - override /hydra/launcher: clusterduck_slurm
  - override /hydra/sweeper: list

hydra:
  mode: MULTIRUN
  launcher:
    timeout_min: 1200
    name: benchmark
    partition: cpuonly
    nodes: 1
    tasks_per_node: 1
    cpus_per_task: 38
    account: "hk-project-p0022232"
    array_parallelism: 120
    setup:
      - export WANDB_DIR=$TMPDIR/wandb
      - mkdir -pv $WANDB_DIR
      - export WANDB_CONSOLE=off
      - export MUJOCO_EGL_DEVICE_ID=0

    parallel_runs_per_node: 4
    total_runs_per_node: null
    resources_config:
      cpu:
      rendering:
      stagger:
        delay: 5

  sweeper:
    grid_params:
      crossq.seed: [0, 1, 2, 3, 4]